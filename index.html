<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twój styl biznesowy – quiz</title><style>
:root{color-scheme:light;--navy:#1d354c;--teal:#247d92;--light:#eef5f7;--muted:#536877}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf3f5,#f8fafb);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--navy);min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px 40px}header{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:1.5px;font-weight:800;margin-bottom:22px;text-transform:uppercase}header span{display:grid;place-items:center;background:var(--navy);color:white;width:36px;height:36px;border-radius:12px;font-size:20px}.panel{background:white;border:1px solid #dce8ed;box-shadow:0 12px 48px #1d354c12;border-radius:22px;padding:clamp(20px,5vw,38px)}h1{font-size:clamp(30px,6vw,49px);line-height:1.1;letter-spacing:-1.5px;margin:10px 0 18px}h2{font-size:clamp(23px,4vw,32px);line-height:1.25;margin:18px 0 22px}p{line-height:1.65;color:var(--muted)}.tag{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:1.3px;text-transform:uppercase}.flags{font-size:32px;letter-spacing:6px;line-height:1.7;margin:20px 0}.primary,.secondary{font:inherit;font-weight:750;border-radius:12px;padding:14px 22px;cursor:pointer;min-height:48px}.primary{background:var(--teal);border:1px solid var(--teal);color:white}.secondary{background:white;color:var(--navy);border:1px solid #cbdbe1}.primary:disabled{opacity:.4;cursor:not-allowed}.primary:hover:not(:disabled){background:#1b6678}.choice{width:100%;text-align:left;background:#f7fafb;border:2px solid #e2ebef;border-radius:13px;color:var(--navy);padding:14px 15px;font:inherit;line-height:1.4;cursor:pointer;display:flex;gap:13px;align-items:center;margin:10px 0;min-height:64px}.choice b{display:grid;place-items:center;background:#e4edf1;border-radius:8px;min-width:32px;height:32px}.choice.selected{background:#e8f5f7;border-color:var(--teal)}.choice.selected b{background:var(--teal);color:#fff}.choice:hover{border-color:var(--teal)}button:focus-visible{outline:3px solid #e2a54b;outline-offset:3px}.progress{height:8px;border-radius:8px;background:#e7eef1;overflow:hidden;margin-top:10px}.progress i{display:block;background:var(--teal);height:100%;transition:width .2s}.top,.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.nav{margin-top:24px}.small{font-size:13px;color:var(--muted)}.result{border-left:4px solid var(--teal);padding-left:16px;margin:22px 0}.result h2{margin:0 0 5px}.result p{margin:0}.barrow{display:grid;grid-template-columns:145px 1fr 42px;align-items:center;gap:10px;margin:12px 0;font-size:14px}.bar{height:10px;border-radius:8px;background:#e9f0f3;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:8px}.foot{text-align:center;font-size:12px;color:var(--muted);margin:20px 0}.hidden{display:none} @media(max-width:390px){.barrow{grid-template-columns:115px 1fr 34px;gap:6px;font-size:12px}.flags{font-size:26px}}
</style></head><body><main><header><span>◎</span> Etykieta biznesowa na świecie</header><section id="app" class="panel" aria-live="polite"></section><div class="foot">Quiz edukacyjny na podstawie prezentacji • Nie określa narodowości ani predyspozycji zawodowych.</div></main><script>
const countries={PL:['🇵🇱','Polska','Profesjonalizm i kultura osobista','Cenisz punktualność, schludny wygląd, uprzejmą komunikację oraz formalne zwroty przy pierwszym kontakcie.'],CN:['🇨🇳','Chiny','Harmonia i zaufanie','Stawiasz na długotrwałe relacje, szacunek dla hierarchii i dyplomację. Wolisz unikać publicznej krytyki.'],SA:['🇸🇦','Arabia Saudyjska','Gościnność i tradycja','Ważne są dla Ciebie gościnność, budowanie zaufania przed negocjacjami oraz szacunek dla lokalnych zwyczajów.'],IN:['🇮🇳','Indie','Cierpliwość i takt','Cenisz rozmowy wstępne, szacunek dla starszeństwa, cierpliwość i uważność na zwyczaje rozmówcy.'],ES:['🇪🇸','Hiszpania','Otwartość i dialog','Preferujesz żywe rozmowy, swobodny kontakt, elastyczność i budowanie relacji również po wspólnym posiłku.'],IT:['🇮🇹','Włochy','Elegancja i relacje','Ważne są dla Ciebie dobry styl, odpowiednie tytułowanie, osobiste zaufanie i wspólne posiłki bez pośpiechu.'],US:['🇺🇸','USA','Inicjatywa i efektywność','Cenisz bezpośredniość, oszczędność czasu, aktywność podczas spotkań i partnerski kontakt z przełożonymi.'],DE:['🇩🇪','Niemcy','Planowanie i rzeczowość','Preferujesz ścisłą punktualność, przygotowanie z wyprzedzeniem, jasną strukturę i precyzyjną komunikację.']};
const questions=[
['Jak witasz nowego partnera biznesowego?',[['PL','Podaję dłoń i używam zwrotów „Pan” lub „Pani”.'],['IN','Najpierw witam osobę najwyższą rangą; chętnie używam tradycyjnego powitania.'],['US','Szybko przechodzę na imię i utrzymuję kontakt wzrokowy.'],['IT','Zwracam uwagę na tytuł zawodowy i eleganckie pierwsze wrażenie.']]],
['Jak organizujesz czas spotkania?',[['DE','Ustalam dokładny plan z wyprzedzeniem i pilnuję każdej godziny.'],['US','Dbam, aby spotkanie było krótkie, sprawne i prowadziło do efektów.'],['ES','Traktuję agendę elastycznie, zostawiając miejsce na naturalną rozmowę.'],['IN','Przychodzę punktualnie, ale cierpliwie podchodzę do zmian w harmonogramie.']]],
['Co jest dla Ciebie ważne przy wymianie wizytówek?',[['CN','Wręczam i odbieram wizytówkę obiema rękami.'],['SA','Podaję przedmioty prawą ręką, z poszanowaniem zwyczajów.'],['IN','Dbam o posiadanie wizytówki i wymianę jej podczas nawiązywania kontaktu.'],['US','Przekazuję ją swobodnie jedną ręką i krótko na nią spoglądam.']]],
['Jak reagujesz, gdy nie zgadzasz się z rozmówcą?',[['ES','Włączam się w żywą dyskusję i okazuję zaangażowanie.'],['CN','Szukam delikatnego sposobu wyrażenia sprzeciwu, bez publicznego zawstydzania.'],['DE','Przedstawiam rzeczowe argumenty wprost, opierając się na faktach.'],['IT','Dbam o osobistą relację i atmosferę, zanim przejdziemy do trudnych konkretów.']]],
['Jaki strój wybierasz na ważne spotkanie?',[['SA','Skromny, schludny i uwzględniający lokalne zwyczaje.'],['IN','Konserwatywny i odpowiednio zakrywający ciało.'],['IT','Nienagannie elegancki, z dbałością o styl i szczegóły.'],['PL','Schludny, profesjonalny i adekwatny do okazji.']]],
['Jak wyobrażasz sobie posiłek biznesowy?',[['ES','Chętnie zostaję przy stole po posiłku, by dalej rozmawiać.'],['IT','Długi lunch traktuję przede wszystkim jako okazję do budowania więzi.'],['SA','Rozpoczynam kontakt od poczęstunku kawą lub herbatą, bez pośpiechu.'],['US','Cenię miłą atmosferę, ale zależy mi też na sprawnym wykorzystaniu czasu.']]],
['Co najbardziej przeszkadza Ci podczas spotkania?',[['PL','Zbyt poufałe zwracanie się do mnie przy pierwszym kontakcie.'],['CN','Publiczne krytykowanie rozmówcy i narażanie go na utratę twarzy.'],['SA','Lekceważenie lokalnych tradycji i zasad gościnności.'],['DE','Spóźnienia oraz podejmowanie działań bez wcześniejszych ustaleń.']]],
['Jaki styl komunikacji w pracy wybierasz?',[['PL','Uprzejmy, kulturalny i z zachowaniem formalności na początku znajomości.'],['CN','Dyplomatyczny, nastawiony na harmonię i trwałe porozumienie.'],['ES','Ekspresyjny, otwarty, z miejscem na rozmowy o codziennym życiu.'],['DE','Bezpośredni i precyzyjny, z wyraźnym oddzieleniem pracy od prywatności.']]],
['Co jest dla Ciebie najważniejsze w relacji z przełożonym?',[['US','Łatwy dostęp do szefa i możliwość swobodnego wyrażenia własnej opinii.'],['DE','Jasna struktura organizacyjna i określone obowiązki.'],['CN','Szacunek dla hierarchii i utrzymywanie harmonijnych relacji.'],['PL','Uprzejmość, profesjonalizm i odpowiednia forma zwracania się.']]],
['Co robisz przed rozpoczęciem negocjacji?',[['IN','Zaczynam od small talku i cierpliwie poznaję rozmówcę.'],['IT','Poświęcam czas na osobistą rozmowę i zbudowanie dobrej atmosfery.'],['SA','Dbam o gościnne przyjęcie i wzajemne zaufanie.'],['ES','Rozmawiam swobodnie o sporcie, kuchni lub sztuce, aby przełamać lody.']]],
['Jakie zasady najbardziej cenisz w codziennej pracy?',[['IT','Dbałość o elegancję, dobre maniery i osobiste relacje.'],['DE','Planowanie z wyprzedzeniem i oddzielenie spraw prywatnych od zawodowych.'],['PL','Punktualność, kultura wypowiedzi i profesjonalny wygląd.'],['SA','Uwzględnianie miejscowych zwyczajów i potrzeb gości.']]],
['Co robisz, gdy negocjacje się przedłużają?',[['CN','Stawiam na długofalowe zaufanie, nawet jeśli decyzja wymaga czasu.'],['US','Aktywnie proponuję rozwiązanie, żeby przyspieszyć ustalenia.'],['ES','Pozwalam rozmowie toczyć się naturalnie, nie poganiam partnera.'],['IN','Zachowuję cierpliwość i upewniam się, że dobrze rozumiem reakcje rozmówcy.']]]
];
let step=-1,answers=[];const app=document.getElementById('app');
function start(){step=0;answers=[];render()}
function home(){step=-1;app.innerHTML=`<div class="tag">Quiz osobowościowy • 12 pytań</div><h1>Do którego kraju pasuje Twój styl biznesowy?</h1><p>Wyobraź sobie, że uczestniczysz w międzynarodowych spotkaniach biznesowych. Wybieraj odpowiedzi, które są Ci najbliższe. Nie ma dobrych ani złych odpowiedzi.</p><div class="flags" aria-label="Osiem krajów">🇵🇱 🇨🇳 🇸🇦 🇮🇳 🇪🇸 🇮🇹 🇺🇸 🇩🇪</div><button class="primary" onclick="start()">Rozpocznij quiz →</button><p class="small">Około 3 minuty · Wynik oblicza się automatycznie.</p>`}
function render(){if(step===questions.length){result();return}const q=questions[step];app.innerHTML=`<div class="top"><span class="tag">Pytanie ${step+1} z ${questions.length}</span><span class="small">${answers.filter(Boolean).length}/${questions.length} odpowiedzi</span></div><div class="progress" role="progressbar" aria-valuenow="${step+1}" aria-valuemin="0" aria-valuemax="12"><i style="width:${(step+1)/questions.length*100}%"></i></div><h2>${q[0]}</h2><div role="group" aria-label="Wybierz odpowiedź">${q[1].map((o,i)=>`<button class="choice ${answers[step]===o[0]?'selected':''}" aria-pressed="${answers[step]===o[0]}" onclick="choose('${o[0]}')"><b>${'ABCD'[i]}</b><span>${o[1]}</span></button>`).join('')}</div><div class="nav"><button class="secondary" onclick="back()">← Wstecz</button><button class="primary" onclick="next()" ${answers[step]?'':'disabled'}>${step===questions.length-1?'Zobacz wynik':'Dalej →'}</button></div>`}
function choose(code){answers[step]=code;render()}function next(){if(answers[step]){step++;render()}}function back(){if(step===0){home()}else{step--;render()}}
function result(){const score=Object.fromEntries(Object.keys(countries).map(k=>[k,0]));answers.forEach(k=>score[k]++);const sorted=Object.keys(score).sort((a,b)=>score[b]-score[a]);const winners=sorted.filter(k=>score[k]===score[sorted[0]]);app.innerHTML=`<div class="tag">Twój wynik</div><h1>${winners.length>1?'Styl mieszany':'Najbliższy styl: '+countries[winners[0]][1]} ${winners.map(k=>countries[k][0]).join(' ')}</h1><p>${winners.length>1?'Kilka stylów uzyskało identyczny najwyższy wynik.':'Najwięcej Twoich odpowiedzi odpowiada temu modelowi etykiety biznesowej z prezentacji.'}</p>${winners.map(k=>`<div class="result"><h2>${countries[k][0]} ${countries[k][1]}</h2><strong>${countries[k][2]}</strong><p>${countries[k][3]}</p></div>`).join('')}<h2>Rozkład punktów</h2>${sorted.map(k=>`<div class="barrow"><span>${countries[k][0]} ${countries[k][1]}</span><div class="bar"><i style="width:${score[k]/6*100}%"></i></div><strong>${score[k]}/6</strong></div>`).join('')}<p class="small">Każda odpowiedź przyznaje jeden punkt jednemu stylowi. Każdy styl pojawia się w sześciu pytaniach. Wynik to uproszczone porównanie preferencji, nie naukowy test ani ocena wszystkich mieszkańców kraju.</p><div class="nav"><button class="secondary" onclick="step=questions.length-1;render()">← Zmień odpowiedź</button><button class="primary" onclick="start()">Zagraj ponownie</button></div>`}
home();</script></body></html>
